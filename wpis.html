  <title>Aktualności – Prolight Solutions</title>
  <link rel="icon" href="favicon.ico" sizes="48x48">

</head>
<body>
  <p>Wpis zmienił adres. <a href="aktualnosci.html">Zobacz wszystkie aktualności</a>.</p>

  <script src="wpisy.js?v=12"></script>
  <script>
  (function () {
    var id = new URLSearchParams(location.search).get("id") || "";
    var post = typeof prolightFindPost === "function" ? prolightFindPost(id) : null;
    location.replace(post ? prolightPostUrl(post) : "aktualnosci.html");
  })();
  </script>
