  <style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --ink: #0a0c10;
--ink2: #13161e;
--white: #ffffff;
  --off: #f5f5f3;
  --amber: #f59e0b;
  --amber2: #fbbf24;
  --amber-dim: rgba(245,158,11,0.1);
--mid: #6b7280;
--muted: #9ca3af;
--border-light: #e5e7eb;
  --font-head: 'Barlow Condensed', sans-serif;
--font-body: 'Barlow', sans-serif;
}

html { scroll-behavior: smooth; }
body {
  background: var(--white);
color: var(--ink);
font-family: var(--font-body);
font-size: 17px;
line-height: 1.65;
-webkit-font-smoothing: antialiased;
}

nav {
  position: fixed; top: 0; left: 0; right: 0; z-index: 200;
height: 64px;
display: flex; align-items: center; justify-content: space-between;
padding: 0 40px;
background: rgba(10,12,16,0.92);
backdrop-filter: blur(20px);
border-bottom: 1px solid rgba(255,255,255,0.07);
}
.nav-logo { display:flex; align-items:center; gap:10px; text-decoration:none; }
.nav-links { display: flex; align-items: center; gap: 32px; list-style: none; }
.nav-links a { color: rgba(255,255,255,0.5); text-decoration: none; font-size: 13px; font-weight: 500; letter-spacing: 0.04em; transition: color 0.2s; }
.nav-links a:hover, .nav-links a.active { color: var(--white); }
.nav-cta { background: var(--amber) !important; color: var(--ink) !important; padding: 9px 18px !important; border-radius: 6px; font-weight: 700 !important; font-size: 12px !important; letter-spacing: 0.06em !important; text-transform: uppercase; transition: background 0.2s !important; }
.nav-cta:hover { background: var(--amber2) !important; }

.page-header { background: var(--ink); padding: 160px 40px 64px; }
.page-header-inner { max-width: 1200px; margin: 0 auto; }
.section-eyebrow { font-family: var(--font-head); font-size: 11px; font-weight: 700; letter-spacing: 0.16em; text-transform: uppercase; color: var(--amber); margin-bottom: 12px; display: flex; align-items: center; gap: 10px; }
.section-eyebrow::before { content: ''; width: 20px; height: 2px; background: var(--amber); display: block; }
  .page-title { font-family: var(--font-head); font-size: clamp(40px, 6vw, 72px); font-weight: 900; color: var(--white); line-height: 0.95; letter-spacing: -0.02em; text-transform: uppercase; margin-bottom: 16px; }
.page-sub { font-size: 17px; color: rgba(255,255,255,0.7); max-width: 560px; }

.filters-bar { background: var(--off); border-bottom: 1px solid var(--border-light); padding: 24px 40px; position: sticky; top: 64px; z-index: 100; }
.filters-inner { max-width: 1200px; margin: 0 auto; display: flex; flex-wrap: wrap; gap: 10px; }
.filter-btn { font-family: var(--font-head); font-size: 13px; font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase; color: var(--ink); background: var(--white); border: 1px solid var(--border-light); border-radius: 999px; padding: 10px 20px; cursor: pointer; transition: all 0.2s; }
.filter-btn:hover { border-color: var(--amber); }
.filter-btn.active { background: var(--ink); color: var(--white); border-color: var(--ink); }

.news-section { padding: 64px 40px 96px; background: var(--white); }
.news-inner { max-width: 1200px; margin: 0 auto; }
.news-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; }
.news-card { background: var(--white); border: 1px solid var(--border-light); border-radius: 16px; padding: 28px; display: flex; flex-direction: column; gap: 14px; transition: transform 0.2s, border-color 0.2s; }
.news-card:hover { transform: translateY(-3px); border-color: var(--amber); }
.news-card-img { width: 100%; aspect-ratio: 16/9; object-fit: cover; border-radius: 10px; margin-bottom: 4px; }
.news-pill { align-self: flex-start; font-family: var(--font-head); font-size: 10px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; padding: 6px 14px; border-radius: 999px; background: var(--amber-dim); color: var(--amber); border: 1px solid rgba(245,158,11,0.25); }
.news-pill.tag-realizacja { background: rgba(59,130,246,0.1); color: #3b82f6; border-color: rgba(59,130,246,0.25); }
.news-pill.tag-zgodnosc { background: rgba(239,68,68,0.1); color: #ef4444; border-color: rgba(239,68,68,0.25); }
.news-pill.tag-serwis { background: rgba(16,185,129,0.1); color: #10b981; border-color: rgba(16,185,129,0.25); }
.news-date { font-size: 13px; color: var(--mid); font-weight: 500; }
.news-card h3 { font-family: var(--font-head); font-size: 20px; font-weight: 800; color: var(--ink); text-transform: uppercase; line-height: 1.15; }
.news-card p { font-size: 15px; color: #374151; line-height: 1.65; }
.news-card p a { color: #b45309; text-decoration: underline; text-underline-offset: 2px; overflow-wrap: anywhere; }
.news-card p a:hover { color: var(--amber); }
.news-card p + p { margin-top: -4px; }
.news-empty { text-align: center; padding: 60px 20px; color: var(--mid); font-size: 16px; grid-column: 1 / -1; }

footer { background: var(--ink2); border-top: 1px solid rgba(255,255,255,0.06); padding: 32px 40px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 16px; }
.footer-logo { font-family: var(--font-head); font-size: 13px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: rgba(255,255,255,0.4); text-decoration: none; }
.footer-copy { font-size: 12px; color: rgba(255,255,255,0.2); }
.footer-links { display: flex; gap: 24px; list-style: none; }
.footer-links a { font-size: 12px; color: rgba(255,255,255,0.3); text-decoration: none; }
.footer-links a:hover { color: rgba(255,255,255,0.6); }

@media (max-width: 900px) {
.news-grid { grid-template-columns: 1fr 1fr; }
}
@media (max-width: 768px) {
nav { padding: 0 20px; }
.nav-links li:not(:last-child):not(:nth-last-child(2)) { display: none; }
.page-header { padding: 120px 20px 48px; }
.filters-bar { padding: 16px 20px; position: static; }
.news-section { padding: 40px 20px 64px; }
.news-grid { grid-template-columns: 1fr; }
footer { padding: 24px 20px; }
}
</style>

  <!-- Przy zmianie kodu strony zwiększ numer v=, żeby przeglądarki pobrały świeże pliki -->
  <script src="posts-data.js?v=7"></script>
  <script src="wpisy.js?v=7"></script>
  <script src="lightbox.js?v=7"></script>
  <script src="do-gory.js?v=8"></script>
  <script>
// Strona pojedynczego wpisu: wpis.html?id=... (treść pochodzi z posts-data.js)
(function () {
  const id = new URLSearchParams(location.search).get("id") || "";
  const post = prolightFindPost(id);
  const esc = s => String(s).replace(/&/g, "&amp;").replace(/"/g, "&quot;").replace(/</g, "&lt;");

  if (!post) {
    document.getElementById("post-title").textContent = "Nie znaleziono wpisu";
    document.getElementById("post-body").innerHTML =
      '<p class="post-empty">Ten wpis nie istnieje albo zmienił adres. <a href="aktualnosci.html">Zobacz wszystkie aktualności</a>.</p>';
    document.querySelector(".post-cta").style.display = "none";
  } else {
    document.title = post.title + " – Prolight Solutions";
    const opis = String(post.excerpt || "").split(/\n\s*\n/)[0].replace(/\[([^\]]+)\]\([^)]+\)/g, "$1").slice(0, 160);
    const meta = document.querySelector('meta[name="description"]');
    if (meta) meta.setAttribute("content", opis);

    document.getElementById("post-meta").innerHTML =
      '<span class="news-pill tag-' + esc(post.category) + '">' + prolightCategoryLabel(post) + "</span>" +
      '<span class="news-date">' + prolightFormatDate(post.date) + "</span>";
    document.getElementById("post-title").textContent = post.title;

    // zdjęcia: pierwsze duże, pozostałe jako miniatury; kliknięcie otwiera galerię
    const zdjecia = prolightImages(post);
    if (zdjecia.length) {
      const galeria = esc(JSON.stringify(zdjecia));
      const img = (src, i) => '<img class="news-card-img" src="' + esc(src) + '" alt="' + esc(post.title) +
        '" data-gallery="' + galeria + '" data-start="' + i + '"' + (i ? ' loading="lazy"' : "") + ">";
      document.getElementById("post-gallery").innerHTML = img(zdjecia[0], 0) +
        (zdjecia.length > 1 ? '<div class="post-thumbs">' + zdjecia.slice(1).map((z, i) => img(z, i + 1)).join("") + "</div>" : "");
    }

    document.getElementById("post-body").innerHTML = prolightFormatText(post.excerpt);
  }

  // inne wpisy (maks. 3 najnowsze)
  const inne = prolightSortedPosts().filter(p => p !== post).slice(0, 3);
  if (inne.length) document.getElementById("news-grid").innerHTML = inne.map(prolightCardHTML).join("");
  else document.getElementById("post-more").style.display = "none";
})();
</script>
